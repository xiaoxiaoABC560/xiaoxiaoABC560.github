isplay:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview-art:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at center,transparent 0 20px,#d5b77922 21px 22px)}.preview-art span{position:relative;z-index:1;color:var(--gold);font-size:45px;white-space:pre;text-shadow:0 3px 8px #0008}.preview-art.hero span{font-size:90px}.lab-preview h3{margin:0;font-size:18px}.lab-preview p{margin:0;color:#d5dfd4;font-size:12px}.form-section{display:grid;gap:10px}.form-section h3{font-size:15px;margin:0}.option{display:flex;align-items:center;gap:9px;font-size:13px;color:#40584e;padding:5px 0}.option input{accent-color:var(--g)}.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.swatch{border:1px solid #ddd4c3;background:#fffaf0;border-radius:10px;padding:8px;text-align:left;color:var(--ink);font-size:11px;cursor:pointer}.swatch i{display:block;height:28px;border-radius:6px;margin-bottom:6px}.swatch.active{outline:2px solid #6e9180}.note{font-size:11px;line-height:1.7;color:#788279}.saved-item button{border:1px solid #c9d1c6;background:transparent;border-radius:8px;padding:7px;color:var(--ink);cursor:pointer}.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty .symbol{font-size:42px}.footer{background:var(--g);color:var(--gold);text-align:center;padding:16px;font-size:11px;letter-spacing:1px}.footer small{display:block;color:#d8e0d5;margin-top:5px;letter-spacing:0}.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#163f39;color:#fff4dc;padding:10px 16px;border-radius:99px;font-size:12px;z-index:20;display:none}

/* Vector studio enhancements: isolated to the creation workspace */

<body><div class="app"><header class="top"><div class="eyebrow">KUNMING · CULTURAL ATLAS</div><div class="brand"><div><h1>纹脉昆明</h1><div class="subtitle">让传统，在当代生长。</div></div><div class="logo">✿</div></div><div class="topnote">◈　一场从文化认知到纹样创作的探索</div></header><main class="content" id="content"></main><footer class="footer">纹脉昆明 · WENMAI KUNMING<small>让地域文化被看见、被理解、被重新创造</small></footer><nav class="bottom-nav"><button class="navbtn active" data-tab="首页"><span class="navicon">⌂</span>首页</button><button class="navbtn" data-tab="探索"><span class="navicon">⌕</span>探索</button><button class="navbtn" data-tab="创作"><span class="navicon">✳</span>创作</button><button class="navbtn" data-tab="收藏"><span class="navicon">♡</span>收藏</button></nav></div><div class="toast" id="toast"></div>
<script>
const cultures={
"铜生万象":{sub:"古滇青铜 · 文明印记",desc:"走近古滇青铜，读懂滇池流域的文明记忆。",icon:"🐂",cls:"bronze",intro:"古滇青铜器通过动物造型、人物活动和带状装饰，留下了观察古代生活与信仰的重要线索。",elements:"牛纹、鸟纹、蛇形纹、涡旋纹、连珠纹与水波纹。",tip:"将器物轮廓简化为线条与几何单元，再尝试二方连续排列。"},
"绣见山河":{sub:"民族刺绣 · 经纬故事",desc:"观察刺绣中的对称构图、色彩节奏和几何拼花。",icon:"✿",cls:"embroidery",intro:"民族刺绣中的构图、色彩和针法，体现了地方服饰装饰的审美与技艺。不同民族与地区的纹样应分别记录来源。",elements:"八角花、菱形、花卉、蝴蝶与连续边饰。",tip:"记录具体民族、地区及来源，避免混用不同民族的传统图案。"},
"瓦猫纳福":{sub:"民间民俗 · 守护符号",desc:"从瓦猫与民间吉祥符号中发现乡土造型。",icon:"🐈",cls:"cat",intro:"瓦猫是云南传统建筑装饰与民间信仰相关的形象，造型往往具有夸张轮廓和鲜明辨识度。",elements:"立耳、大嘴、眼部轮廓、云纹和剪纸式边缘。",tip:"提取轮廓后，可尝试应用于布贴、胸章、包袋和局部印花。"},

let tab="首页",culture="铜生万象",showDetail=false,motif="牛纹",mode="连续纹样",palette="古滇青",saved=JSON.parse(localStorage.getItem("wenmai-saved")||'["铜生万象"]');

];let nextLayerId=5;

function header(a,b){return `<div class="section-title"><h2>${a}</h2><p>${b||""}</p></div>`}
function home(){return `<section class="feature"><div class="feature-art"><span class="big-symbol">🐂</span><span class="art-label">ANCIENT DIAN · BRONZE MEMORY</span></div><div class="feature-body"><div class="eyebrow">✦ 今日文化 · 3 分钟速读</div><h2>铜生万象</h2><p>从一件青铜器，读懂古滇文明的生活与信仰。</p><div class="meta"><span>滇池流域的青铜记忆</span><span>↗</span></div><button class="btn" data-action="open" data-culture="铜生万象">开始探索　→</button></div></section>${header("探索昆明四大文脉","从历史、刺绣、民俗到山水自然")}<div class="grid">${Object.entries(cultures).map(([n,c],i)=>`<button class="culture-card" data-action="open" data-culture="${n}"><div class="card-art ${c.cls}"><span>${c.icon}</span></div><div class="card-copy"><h3>${String(i+1).padStart(2,"0")} ${n}</h3><p>${c.sub}</p></div></button>`).join("")}</div><button class="lab-banner" data-action="tab" data-tab="创作"><span class="lab-icon">✳</span><span><strong>纹样实验室</strong><small>提取文化元素，创作属于你的纹样。</small></span><span class="arrow">→</span></button>`}

 <ellipse cx="35" cy="-17" rx="2.6" ry="3" fill="${stroke}" stroke="none"/>

 <path d="M-25 -13 C-34 -22 -20 -29 -14 -20 C-9 -12 -22 -8 -24 -15 C-25 -18 -19 -21 -17 -17 M-3 -14 C-11 -23 3 -29 9 -20 C14 -12 2 -8 0 -15 C-1 -18 5 -21 7 -17" fill="none" stroke="${stroke}" stroke-width="2.6"/>

 <circle r="20" fill="${fill}"/><circle r="13" fill="none" stroke-width="2.5"/><path d="M0 -9 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3Z" fill="${stroke}" stroke="none"/><circle r="3.5" fill="${stroke}" stroke="none"/></g>`;
 if(name==="瓦猫")return `<g transform="${t}" stroke="${stroke}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">

 <path d="M-28 -8 Q-16 -22 -5 -8 L-8 5 Q-19 9 -28 -8Z M28 -8 Q16 -22 5 -8 L8 5 Q19 9 28 -8Z" fill="${stroke}"/><ellipse cx="-17" cy="-6" rx="3.5" ry="5" fill="${fill}" stroke="none"/><ellipse cx="17" cy="-6" rx="3.5" ry="5" fill="${fill}" stroke="none"/>
 <path d="M-7 9 L0 3 L7 9 L0 15Z" fill="${stroke}"/><path d="M-25 16 Q-13 8 0 17 Q13 8 25 16 L20 34 Q0 43 -20 34Z" fill="${stroke}"/><path d="M-14 18 L-10 30 L-4 20 M14 18 L10 30 L4 20" fill="${fill}" stroke-width="2"/><path d="M-26 15 L-40 11 M-26 23 L-41 27 M26 15 L40 11 M26 23 L41 27" fill="none"/><path d="M-12 -28 Q0 -37 12 -28 L8 -22 L0 -25 L-8 -22Z" fill="${stroke}"/><path d="M-22 39 L-27 45 M22 39 L27 45" fill="none" stroke-width="3"/></g>`;
 if(name==="水波纹")return `<g transform="${t}" stroke-linecap="round" stroke-linejoin="round"><path d="M-48 -24 C-34 -42 -19 -39 -7 -24 S18 -8 31 -24 S48 -39 53 -28 C45 -7 27 2 10 -8 S-20 -4 -34 8 S-49 17 -53 7 C-42 -8 -25 -14 -10 -3 S18 14 32 4 S47 -1 52 10 C37 34 16 34 0 22 S-27 12 -43 30" fill="none" stroke="${fill}" stroke-width="8"/><path d="M-48 -24 C-34 -42 -19 -39 -7 -24 S18 -8 31 -24 S48 -39 53 -28 M-53 7 C-42 -8 -25 -14 -10 -3 S18 14 32 4 S47 -1 52 10" fill="none" stroke="${stroke}" stroke-width="2.3"/><circle cx="-39" cy="-37" r="3" fill="${stroke}"/><circle cx="39" cy="35" r="3" fill="${stroke}"/></g>`;
 if(name==="飞鸟")return `<g transform="${t}" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
 <!-- 鸟首朝右，突出尖喙、眼、背部、分层翅羽与分叉尾羽 -->
 <path d="M-38 6 Q-30 -6 -16 -7 Q-9 -24 7 -27 Q19 -28 27 -20 L35 -19 L49 -13 L34 -8 Q31 2 18 8 Q4 17 -12 13 L-25 11Z" fill="${fill}"/>
 <path d="M-15 -7 Q-18 -27 -4 -40 Q-2 -24 7 -20 Q20 -16 24 -8 Q9 -1 -1 3Z" fill="${fill}"/>
 <path d="M-10 -15 Q-5 -26 0 -30 M-3 -9 Q8 -19 17 -14 M-18 -3 Q-3 -7 8 0 M-20 3 Q-5 2 4 7" fill="none" stroke-width="2.4"/>
 <path d="M34 -19 L50 -13 L34 -8Z" fill="${stroke}"/>
 <circle cx="29" cy="-17" r="2.2" fill="${stroke}" stroke="none"/>
 <path d="M-36 6 L-50 18 L-31 14 L-43 26 L-20 13" fill="${fill}"/>

 return `<g transform="${t}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-48 30 L-30 4 L-19 14 L2 -35 L19 -8 L28 -19 L49 30Z" fill="${fill}"/><path d="M-30 4 L-16 30 M2 -35 L4 30 M19 -8 L13 30" fill="none" stroke-width="2"/><path d="M-55 36 Q-42 28 -29 36 T-3 36 T23 36 T52 36" fill="none" stroke-width="4"/><path d="M-46 22 Q-37 14 -28 22 M26 19 Q35 11 44 19" fill="none" stroke-width="2"/></g>`;
}
function layerMarkup(layer,c){if(!layer.visible)return "";let op=layer.opacity/100,sc=layer.scale/100;
 if(layer.type==="background")return `<rect width="400" height="280" fill="${c.bg}" opacity="${op}"/>`;
 if(layer.type==="rings")return `<g opacity="${op}" transform="translate(200 140) scale(${sc})" fill="none" stroke="${c.fg}" stroke-width="1.4"><circle r="82"/><circle r="99" stroke-dasharray="3 7"/><circle r="117" opacity=".45"/><path d="M-130 0 H130 M0 -130 V130" opacity=".3"/></g>`;
 if(layer.type==="motif"){let size=(mode==="主视觉图案"?108:mode==="独立纹样"?86:58)*sc;if(mode==="连续纹样")return Array.from({length:5},(_,i)=>motifShape(motif,42+i*79,140,size,c.fg,c.accent)).join("");return motifShape(motif,200,140,size,c.fg,c.accent)}
 if(layer.type==="accent"){return `<g opacity="${op}" fill="none" stroke="${c.accent}" stroke-width="2">${Array.from({length:7},(_,i)=>`<path d="M${30+i*56} 20 l10 10 -10 10 -10 -10Z M${30+i*56} 240 l10 10 -10 10 -10 -10Z"/>`).join("")}</g>`}
 if(layer.type==="dots")return `<g fill="${c.fg}" opacity="${op}">${Array.from({length:24},(_,i)=>`<circle cx="${30+(i%8)*49}" cy="${42+Math.floor(i/8)*98}" r="2.5"/>`).join("")}</g>`;
 return ""}
function vectorSvg(){let c=colors();return `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 400 280" role="img" aria-label="纹脉昆明原创矢量纹样">${layers.map(l=>`<g id="layer-${l.id}" data-layer="${esc(l.name)}">${layerMarkup(l,c)}</g>`).join("")}</svg>`}
function layerControls(){return `<section class="form-section"><h3>④ 图层编辑</h3><p class="note">可调整图层显示、透明度与缩放，也可调整顺序或删除图层。</p><div class="layer-panel">${layers.map((l,i)=>`<div class="layer-row"><input type="checkbox" aria-label="显示${esc(l.name)}" data-action="layer-visible" data-id="${l.id}" ${l.visible?"checked":""}><span class="layer-name">${esc(l.name)}</span><span class="layer-tools"><button data-action="layer-up" data-id="${l.id}" ${i===0?"disabled":""}>↑</button><button data-action="layer-down" data-id="${l.id}" ${i===layers.length-1?"disabled":""}>↓</button><button data-action="layer-delete" data-id="${l.id}" ${layers.length<=1?"disabled":""}>×</button></span><div class="layer-adjust"><span>透明度</span><input type="range" min="0" max="100" value="${l.opacity}" data-action="layer-opacity" data-id="${l.id}"><span>${l.opacity}%</span></div><div class="layer-adjust"><span>缩放</span><input type="range" min="50" max="150" value="${l.scale}" data-action="layer-scale" data-id="${l.id}"><span>${l.scale}%</span></div></div>`).join("")}</div><div class="layer-foot"><button data-action="layer-add" data-type="dots">＋ 点状装饰层</button><button data-action="layer-add" data-type="rings">＋ 圆环装饰层</button><button data-action="layer-reset">恢复默认图层</button></div></section>`}
function create(){let svg=vectorSvg();return `<h2 class="page-title">纹样实验室</h2><p class="lead">生成可编辑的原创 SVG 矢量纹样，并导出用于后续设计。</p><section class="lab-preview"><div class="eyebrow">VECTOR PREVIEW · 矢量预览</div><div class="vector-stage">${svg}</div><h3>${motif} · ${mode}</h3><p>当前配色：${palette}　｜　图层：${layers.length}</p></section><section class="form-section"><h3>① 选择文化元素</h3><div class="pills">${["牛纹","八角花","瓦猫","水波纹","飞鸟","山形"].map(x=>`<button class="pill ${motif===x?"active":""}" data-action="motif" data-value="${x}">${x}</button>`).join("")}</div></section><section class="form-section"><h3>② 选择纹样构成</h3>${["独立纹样","连续纹样","主视觉图案"].map(x=>`<label class="option"><input type="radio" name="mode" value="${x}" ${mode===x?"checked":""}>${x}${x==="独立纹样"?" · 适合胸章与局部装饰":x==="连续纹样"?" · 适合袖口与衣缘":" · 适合大面积印花"}</label>`).join("")}</section><section class="form-section"><h3>③ 选择色彩体系</h3><div class="swatches">${[["古滇青","#123e3a","#d5b779"],["民族绣彩","#182a48","#c33b37"],["春城自然","#347e79","#e9a8ad"]].map(([n,a,b])=>`<button class="swatch ${palette===n?"active":""}" data-action="palette" data-value="${n}"><i style="background:linear-gradient(90deg,${a} 0 55%,${b} 55%)"></i>${n}</button>`).join("")}</div></section>${layerControls()}<section class="form-section"><h3>⑤ 文件导出</h3><div class="studio-actions"><button class="btn" data-action="export-svg">导出 SVG 矢量</button><button class="secondary" data-action="export-png">导出 PNG 图片</button><button class="secondary" data-action="export-json">导出设计配置</button><button class="secondary" data-action="save-design">♡ 保存创作方案</button></div><p class="export-note">SVG 可在 Illustrator、Inkscape 等软件中继续编辑；PNG 适合快速预览；设计配置 JSON 可保存当前纹样、配色与图层参数。</p></section>`}
function collection(){return `<h2 class="page-title">我的收藏</h2><p class="lead">保存的文化卡片与创作方案。</p>${saved.length?`<div class="saved-list">${saved.map(item=>`<div class="saved-item"><span class="topic-mark">${item.includes("·")?"✳":(cultures[item]?.icon||"✿")}</span><span style="flex:1"><strong>${item}</strong><small>${item.includes("·")?"纹样创作方案":"文化探索收藏"}</small></span><button data-action="view" data-value="${item}">查看</button><button data-action="remove" data-value="${item}">删除</button></div>`).join("")}</div>`:`<div class="empty"><div class="symbol">♡</div><strong>还没有收藏</strong><p>去探索文化，或保存你的第一个纹样方案。</p><button class="btn" data-action="tab" data-tab="探索">开始探索</button></div>`}`}
function render(){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.getElementById("content").innerHTML=tab==="首页"?home():tab==="探索"?explore():tab==="创作"?create():collection();window.scrollTo({top:0,behavior:"smooth"})}
function downloadFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportPng(){let svg=vectorSvg(),blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{let canvas=document.createElement("canvas");canvas.width=2400;canvas.height=1680;let ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);canvas.toBlob(png=>{if(!png){toast("PNG 导出失败，请尝试导出 SVG");return}let a=document.createElement("a"),u=URL.createObjectURL(png);a.href=u;a.download="wenmai-kunming-pattern.png";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast("PNG 图片已导出")},"image/png")};img.onerror=()=>{URL.revokeObjectURL(url);toast("PNG 导出失败，请尝试导出 SVG")};img.src=url}
document.addEventListener("click",e=>{let b=e.target.closest("[data-action]");if(!b)return;let a=b.dataset.action;
if(a==="tab")setTab(b.dataset.tab);
if(a==="open"||a==="select"){culture=b.dataset.culture;tab="探索";showDetail=true;render()}
if(a==="use"){motif={"铜生万象":"牛纹","绣见山河":"八角花","瓦猫纳福":"瓦猫","春水织花":"水波纹"}[culture];tab="创作";render()}
if(a==="save"){saved=saved.includes(culture)?saved.filter(x=>x!==culture):[...saved,culture];persist();render();toast(saved.includes(culture)?"已加入收藏":"已取消收藏")}
if(a==="motif"){motif=b.dataset.value;render()}
if(a==="palette"){palette=b.dataset.value;render()}
if(a==="layer-opacity"){let l=layers.find(x=>x.id===Number(b.dataset.id));if(l){l.opacity=Number(b.value);let v=b.value;render();let inp=document.querySelector(`[data-action="layer-opacity"][data-id="${l.id}"]`);if(inp)inp.value=v}}
if(a==="layer-scale"){let l=layers.find(x=>x.id===Number(b.dataset.id));if(l){l.scale=Number(b.value);render()}}
if(a==="layer-up"||a==="layer-down"){let i=layers.findIndex(x=>x.id===Number(b.dataset.id)),j=a==="layer-up"?i-1:i+1;if(i>=0&&j>=0&&j<layers.length){[layers[i],layers[j]]=[layers[j],layers[i]];render()}}
if(a==="layer-delete"){layers=layers.filter(x=>x.id!==Number(b.dataset.id));render();toast("图层已删除")}
if(a==="layer-add"){let type=b.dataset.type;layers.push({id:nextLayerId++,name:type==="dots"?"点状装饰":"圆环装饰",type,visible:true,opacity:75,scale:100});render();toast("已添加图层")}
if(a==="layer-reset"){layers=[{id:1,name:"底色",type:"background",visible:true,opacity:100,scale:100},{id:2,name:"装饰圆环",type:"rings",visible:true,opacity:65,scale:100},{id:3,name:"主体纹样",type:"motif",visible:true,opacity:100,scale:100},{id:4,name:"辅助纹样",type:"accent",visible:true,opacity:75,scale:100}];nextLayerId=5;render();toast("已恢复默认图层")}
if(a==="export-svg"){downloadFile("wenmai-kunming-pattern.svg",vectorSvg(),"image/svg+xml;charset=utf-8");toast("SVG 矢量文件已导出")}
if(a==="export-png"){exportPng()}
if(a==="export-json"){downloadFile("wenmai-kunming-design.json",JSON.stringify({project:"纹脉昆明",motif,mode,palette,layers},null,2),"application/json;charset=utf-8");toast("设计配置已导出")}
if(a==="save-design"){let x=motif+"·"+mode;if(!saved.includes(x))saved.push(x);persist();toast("创作方案已保存")}
if(a==="remove"){saved=saved.filter(x=>x!==b.dataset.value);persist();render();toast("已删除")}
if(a==="view"){let x=b.dataset.value;if(x.includes("·")){[motif,mode]=x.split("·");tab="创作";render()}else{culture=x;tab="探索";showDetail=true;render()}}
});
document.addEventListener("input",e=>{let el=e.target;if(el.dataset.action!=="layer-opacity"&&el.dataset.action!=="layer-scale")return;let l=layers.find(x=>x.id===Number(el.dataset.id));if(!l)return;if(el.dataset.action==="layer-opacity")l.opacity=Number(el.value);else l.scale=Number(el.value);let content=document.getElementById("content");let stage=content.querySelector(".vector-stage");if(stage)stage.innerHTML=vectorSvg();let label=el.parentElement.querySelector("span:last-child");if(label)label.textContent=el.value+"%"});
document.addEventListener("change",e=>{if(e.target.name==="mode"){mode=e.target.value;render()}if(e.target.dataset.action==="layer-visible"){let l=layers.find(x=>x.id===Number(e.target.dataset.id));if(l){l.visible=e.target.checked;render()}}});
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));render();
</script></body></html>
